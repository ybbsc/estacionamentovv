<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Confirmar saída | ParkHub</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" type="image/png" href="/favicon.png">
    </head>
    <body>
        <main class="page">
            <section class="card wide">
                <div class="brand" aria-label="ParkHub"><span class="brand-park">Park</span><span class="brand-hub">Hub</span></div>
                <div class="warning-icon">!</div>
                <h2>Confirmar saída do veículo</h2>
                <p class="subtitle center">Confira os dados abaixo antes de confirmar que o veículo deixou o estacionamento.</p>
                <div class="vehicle-details">
                    <div class="detail"><span>Placa</span><strong th:text="${veiculo.placa}">ABC-1234</strong></div>
                    <div class="detail"><span>Modelo</span><strong th:text="${veiculo.modelo}">Modelo</strong></div>
                    <div class="detail"><span>Cor</span><strong th:text="${veiculo.cor}">Cor</strong></div>
                    <div class="detail"><span>Observações</span><strong th:text="${veiculo.observacoes != null and !veiculo.observacoes.isEmpty() ? veiculo.observacoes : 'Nenhuma'}">Nenhuma</strong></div>
                    <div class="detail"><span>Entrada</span><strong th:text="${#temporals.format(veiculo.horaEntrada, 'dd/MM/yyyy HH:mm:ss')}">01/10/2026 08:00:00</strong></div>
                    <div class="detail highlight-danger"><span>Horário da saída</span><strong th:text="${#temporals.format(horaSaida, 'dd/MM/yyyy HH:mm:ss')}">01/10/2026 08:30:00</strong></div>
                </div>
                <form class="actions" method="post" action="/veiculo/saida">
                    <input type="hidden" name="id" th:value="${veiculo.id}">
                    <button class="danger" type="submit">Sim, confirmar saída</button>
                    <a class="button secondary" th:href="@{/veiculo/registro/{id}(id=${veiculo.id})}">Ver registro completo</a>
                    <a class="button secondary" href="/veiculo/registrar-saida">Cancelar</a>
                </form>
            </section>
        </main>
    </body>
</html>
