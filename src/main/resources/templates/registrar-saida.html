
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar saída | ParkHub</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<main class="page">
    <section class="card wide exit-list-card">

        <div class="brand" aria-label="ParkHub">
            <span class="brand-park">Park</span><span class="brand-hub">Hub</span>
        </div>

        <h1>Registrar saída</h1>

        <p class="subtitle">
            Selecione o veículo que está deixando o estacionamento.
            Confira os dados antes de confirmar a saída.
        </p>

        <p class="helper exit-empty"
           th:if="${veiculos == null or veiculos.isEmpty()}">
            Nenhum veículo está estacionado no momento.
        </p>

        <div class="exit-vehicle-list"
             th:if="${veiculos != null and !veiculos.isEmpty()}">

            <div class="exit-vehicle-row" th:each="v : ${veiculos}">

                <div class="exit-vehicle-info">
                    <strong th:text="${v.placa}">ABC-1234</strong>

                    <span class="exit-vehicle-description"
                          th:text="${v.modelo + ' — ' + v.cor}">
                        Modelo — Cor
                    </span>
                </div>

                <form method="post"
                      th:action="@{/veiculo/confirmar-saida}"
                      class="exit-vehicle-action">

                    <input type="hidden" name="id" th:value="${v.id}">

                    <button class="exit-register-button" type="submit">
                        Registrar saída
                    </button>
                </form>

            </div>
        </div>

        <div class="exit-footer">
            <a class="button secondary" href="/painel">
                ← Voltar ao painel
            </a>
        </div>

    </section>
</main>
</body>
</html>
