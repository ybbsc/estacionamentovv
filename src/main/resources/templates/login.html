<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | ParkHub</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" type="image/png" href="/favicon.png">
    </head>
    <body>
        <main class="page">
            <section class="card auth-card">
                <div class="brand" aria-label="ParkHub"><span class="brand-park">Park</span><span class="brand-hub">Hub</span></div>
                <h1>Bem-vindo de volta</h1>
                <p class="subtitle">Acesse o painel para gerenciar as entradas do estacionamento.</p>
                <form class="form" method="post" action="/autenticar">
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input class="input" type="email" name="email" id="email" placeholder="voce@email.com" required="">
                    </div>
                    <div class="field">
                        <label for="senha">Senha</label>
                        <input class="input" type="password" name="senha" id="senha" placeholder="Digite sua senha" required="">
                    </div>
                    <button type="submit">Entrar no painel <span>→</span></button>
                </form>
                <div class="divider"></div>
                <p class="helper center">Ainda não possui uma conta? <a href="/cadastro">Criar cadastro</a></p>
            </section>
        </main>
    </body>
</html>
