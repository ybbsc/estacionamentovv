<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Concluído | ParkHub</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="icon" type="image/png" href="/favicon.png">
    </head>
    <body>
        <main class="page">
            <section class="card center">
                <div class="success-icon">✓</div>
                <h2 th:text="${mensagem != null ? mensagem : 'Operação concluída!'}">Operação concluída!</h2>
                <p class="subtitle">A operação foi processada com sucesso.</p>
                <div class="actions"><a class="button" href="/painel">Ir para o painel</a><a class="button secondary" href="/veiculo/cadastrar">Registrar outra entrada</a></div>
            </section>
        </main>
    </body>
</html>
